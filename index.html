<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4ecfa">
  <title>마녀의 솥</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>마녀의 솥</h1>
      <p>사진 한 장과 마법 재료로 만드는 할로윈 장식</p>
    </header>

    <!-- 사진 선택 -->
    <section id="upload-section" class="panel">
      <h2>솥에 넣을 사진을 골라줘</h2>
      <p>배경이 있는 사진도 오려서 사용할 수 있어.</p>

      <label class="button primary" for="image-input">
        사진 선택
      </label>
      <input id="image-input" type="file"
             accept="image/png,image/jpeg,image/webp" hidden>

      <p class="small">
        사진은 이 페이지 안에서 처리하며 서버에 업로드하지 않아요.
      </p>
    </section>

    <!-- 사진 오리기 -->
    <section id="editor-section" class="panel" hidden>
      <h2>솥에 넣을 부분 고르기</h2>

      <div class="toolbar">
        <button id="use-original-button" type="button"
                aria-pressed="true">그대로 사용</button>
        <button id="select-region-button" type="button"
                aria-pressed="false">영역 선택해서 오리기</button>
      </div>

      <p id="editor-help">
        투명한 사진은 그대로, 일반 사진은 정사각형으로 넣어요.
      </p>

      <div id="editor-tools" class="toolbar" hidden>
        <button id="brush-button" type="button"
                aria-pressed="true">남길 부분 칠하기</button>
        <button id="eraser-button" type="button"
                aria-pressed="false">선택 지우기</button>
        <button id="pan-button" type="button"
                aria-pressed="false">화면 이동</button>
        <button id="undo-button" type="button">실행 취소</button>

        <label for="brush-size">브러시 크기</label>
        <input id="brush-size" type="range"
               min="5" max="100" value="30">
      </div>

      <div class="toolbar">
        <label for="editor-zoom">확대</label>
        <input id="editor-zoom" type="range"
               min="1" max="4" step="0.1" value="1">
        <button id="reset-view-button" type="button">위치 초기화</button>
      </div>

      <div class="editor-workspace">
        <div class="canvas-frame">
          <canvas id="editor-canvas" width="600" height="600"
                  aria-label="사진 영역 선택 화면"></canvas>
        </div>

        <div class="preview-area">
          <p>솥에 들어갈 모습</p>
          <div class="canvas-frame checkerboard">
            <canvas id="preview-canvas" width="240" height="240"
                    aria-label="오린 사진 미리보기"></canvas>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="editor-reselect-button" type="button">
          사진 다시 선택
        </button>
        <button id="put-image-button" type="button" class="primary">
          솥에 넣기
        </button>
      </div>
    </section>

    <!-- 재료 선택 · 섞기 · 완성 -->
    <section id="toy-section" class="panel" hidden>
      <h2 id="stage-title">마법 재료를 넣어줘</h2>
      <p id="stage-help">
        병을 솥 입구로 끌어가면 재료가 쏟아져요.
      </p>

      <div id="bottle-shelf" class="bottle-shelf"
           aria-label="마법 재료 선반">
        <!-- app.js에서 재료 병 6개를 만듭니다. -->
      </div>

      <div id="color-panel" class="color-panel" hidden>
        <h3 id="color-title">파츠 색 고르기</h3>

        <label for="part-hue">색조</label>
        <input id="part-hue" type="range"
               min="0" max="359" value="45">

        <label for="part-lightness">밝기</label>
        <input id="part-lightness" type="range"
               min="15" max="85" value="60">

        <span id="color-preview" aria-label="선택한 색 미리보기"></span>
        <button id="close-color-button" type="button">완료</button>
      </div>

      <div id="scene-wrap" class="scene-wrap">
        <canvas id="scene-canvas" width="600" height="600"
                aria-label="마녀의 솥과 완성 이미지"></canvas>

        <div id="pour-gauge" class="pour-gauge" hidden
             role="progressbar" aria-label="현재 재료의 양"
             aria-valuemin="0" aria-valuemax="3" aria-valuenow="0">
          <div class="gauge-track">
            <div id="gauge-fill" class="gauge-fill"></div>
          </div>
          <span id="gauge-label">1단계</span>
        </div>
      </div>

      <div class="actions">
        <button id="confirm-button" type="button"
                class="primary" disabled>선택 완료</button>
        <button id="mix-button" type="button"
                class="primary" hidden>섞기!</button>
      </div>

      <div id="result-actions" class="actions" hidden>
        <button id="remix-button" type="button">다시 섞기</button>
        <button id="save-png-button" type="button">이미지 저장</button>
        <button id="save-gif-button" type="button" class="primary">
          GIF 만들기
        </button>
      </div>

      <div id="export-status" hidden role="status" aria-live="polite">
        <p id="export-message">GIF를 만들고 있어요.</p>
        <progress id="export-progress" max="100" value="0"></progress>
      </div>

      <div id="gif-result" hidden>
        <img id="gif-preview" alt="완성된 마녀의 솥 GIF">
        <a id="gif-download" class="button primary"
           download="witch-cauldron.gif">GIF 저장</a>
      </div>

      <div class="actions secondary-actions">
        <button id="restart-button" type="button">다시 만들기</button>
        <button id="reselect-button" type="button">사진 다시 선택</button>
      </div>
    </section>

    <p id="status-message" role="status" aria-live="polite"></p>
  </main>

  <!-- 기능 파일은 이 순서로 불러옵니다. -->
  <script src="./image-editor.js" defer></script>
  <script src="./scene.js" defer></script>
  <script src="./gif-export.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
